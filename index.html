<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b10411" />
  <title>objectboxd</title>
  <link rel="stylesheet" href="style.css?v=91" />
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <!-- Full-screen red-tinted poster, behind the text (result only) -->
  <div id="posterBack" aria-hidden="true"></div>

  <!-- Rotating sphere of text -->
  <div id="sphereWrap" aria-hidden="true"></div>

  <!-- Figure (exact silhouette from fig.png), small, fixed center-bottom:
       black silhouette always; poster layer crossfades in on a draw -->
  <div id="monkWrap" aria-hidden="true">
    <div class="fig-window fig-black"></div>
    <div class="fig-window fig-poster" id="figWindow"></div>
    <div class="fig-window fig-poster" id="figWindow2"></div>
  </div>

  <!-- Gradient veil over lower portion -->
  <div class="veil" aria-hidden="true"></div>

  <!-- UI Screens -->
  <main id="app">

    <!-- ① UPLOAD -->
    <section class="screen" id="screenUpload">
      <p class="upload-hint"><a class="hint-link" href="https://letterboxd.com/user/exportdata/" target="_blank" rel="noopener">drop your letterboxd export</a><br>
        <span>settings → data → export your data · .zip or .csv</span>
      </p>
      <div id="dropzone" class="dropzone" role="button" tabindex="0"
           aria-label="Upload Letterboxd export file">
        <input type="file" id="fileInput" accept=".zip,.csv" multiple />
      </div>
      <div class="upload-logo">objectboxd</div>
      <p class="upload-error hidden" id="uploadError" role="alert"></p>
    </section>

    <!-- ② CONTROLS -->
    <section class="screen hidden" id="screenControls">
      <header class="ctrl-top">
        <span class="ctrl-logo">objectboxd</span>
        <div class="ctrl-top-actions">
          <button class="btn-ghost" id="refreshBtn">↑ upload new</button>
          <button class="btn-ghost watch-open" id="watchOpenBtn">⧉ torrents</button>
        </div>
      </header>
      <div class="ctrl-mid">
        <div class="select-row">
          <select id="sourceSelect" aria-label="Choose a list"></select>
          <span id="sourceCount" class="source-count"></span>
        </div>
      </div>
      <div class="ctrl-actions">
        <button class="draw-btn" id="drawBtn">◎ draw</button>
      </div>
    </section>

    <!-- ④ WHAT CAN I WATCH (watchlist ∩ followed lists) -->
    <section class="screen hidden" id="screenWatch">
      <header class="watch-head">
        <button class="btn-ghost" id="watchBackBtn">← back</button>
        <div class="watch-controls">
          <button class="unavail-toggle" id="watchUnavail" data-state="off">unavailable: off</button>
          <button class="dl-toggle" id="watchDownloads" aria-pressed="false">↓ downloads only</button>
          <button class="rental-toggle hidden" id="watchRental" data-state="on">rentals: on</button>
          <span class="sort-group">
            <select id="watchSort" class="watch-sort" aria-label="Sort films">
              <option value="added">date added</option>
              <option value="year">year released</option>
              <option value="alpha">alphabetical</option>
            </select>
            <button class="sort-dir" id="watchSortDir" aria-label="Toggle sort direction">↑</button>
          </span>
        </div>
      </header>
      <div class="watch-body" id="watchBody"></div>
    </section>

    <!-- ③ RESULT -->
    <section class="screen hidden" id="screenResult">
      <button class="btn-ghost result-back" id="backBtn">← back</button>
      <div class="result-body">
        <div class="result-year" id="resultYear"></div>
        <h2 class="result-title" id="resultTitle"></h2>
        <div class="result-actions">
          <a class="result-lb" id="resultLink" href="#" target="_blank" rel="noopener">
            Letterboxd ↗
          </a>
          <button class="result-again" id="spinAgain">again</button>
        </div>
      </div>
      <div class="result-avail" id="resultAvail" aria-label="where to watch"></div>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
    integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js?v=91"></script>
</body>
</html>
